# Weekly dependency updates: patch and minor bumps arrive as one grouped pull
# request per ecosystem, majors one by one.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Matches the Node runtime in .node-version, so it moves with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
