# Weekly dependency updates: patch and minor bumps arrive as one grouped pull
# request per ecosystem, majors one by one.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Matches the Node runtime in .node-version, so it moves with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A git tag dependency: Dependabot misreads its tags and proposes
      # downgrades. It is bumped by hand with each cck-shared release.
      - dependency-name: "@cckarchev/shared"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
